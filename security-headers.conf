# Security headers for every response (popcrm-web issue #70).
#
# nginx drops ALL server-level add_header directives inside any location that
# declares an add_header of its own (e.g. the per-location Cache-Control lines
# in nginx.conf), so this snippet is intentionally included in EACH location.
#
# Copied by the Dockerfile to /etc/nginx/snippets/security-headers.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# CSP ships report-only first (issue #70 LOCKED); enforce in a later change
# after a week with no violations. Drafted from the origins the bundle really
# uses: 'self', the shared Supabase project (API + auth + storage-hosted
# customer logos; wss allowed for supabase-js realtime), img.logo.dev
# (domain-derived customer logos, CustomerLogo.tsx), and the Fireflies health
# endpoint (constants.ts FIREFLIES_HEALTH_URL). 'unsafe-inline' stays in
# style-src for React inline style attributes.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.logo.dev https://qsllyeztdwjgirsysgai.supabase.co; font-src 'self'; connect-src 'self' https://qsllyeztdwjgirsysgai.supabase.co wss://qsllyeztdwjgirsysgai.supabase.co https://crm-fireflies.designflow.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
