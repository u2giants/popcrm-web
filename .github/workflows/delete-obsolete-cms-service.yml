name: Delete stopped obsolete CMS service

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm replacement applications are healthy
        shell: bash
        run: |
          set -euo pipefail
          for url in https://crm.designflow.app https://pm.designflow.app \
            https://dam.designflow.app/library https://sg.designflow.app/library \
            https://crm-fireflies.designflow.app/health; do
            curl --fail --silent --show-error --location --retry 3 "$url" >/dev/null
          done

      - name: Delete stopped service and its volumes through Coolify
        shell: bash
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          SERVICE_UUID: nzli85mk3luzb6u7cnq5fidu
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${COOLIFY_API_TOKEN}"
          service="$(curl --fail --silent --show-error \
            "${COOLIFY_BASE_URL}/api/v1/services/${SERVICE_UUID}" -H "$auth")"
          test "$(jq -r '.uuid' <<<"$service")" = "$SERVICE_UUID"
          status="$(jq -r '.status' <<<"$service")"
          if [[ "$status" == running* ]]; then
            echo "Refusing to delete a service Coolify still reports as running." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X DELETE \
            "${COOLIFY_BASE_URL}/api/v1/services/${SERVICE_UUID}?delete_configurations=true&delete_volumes=true&docker_cleanup=true&delete_connected_networks=true" \
            -H "$auth" >/dev/null
          for attempt in {1..36}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${COOLIFY_BASE_URL}/api/v1/services/${SERVICE_UUID}" -H "$auth")"
            if [[ "$code" == 404 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Coolify did not finish deleting the service within 180 seconds." >&2
          exit 1

      - name: Confirm replacement applications remain healthy
        shell: bash
        run: |
          set -euo pipefail
          for url in https://crm.designflow.app https://pm.designflow.app \
            https://dam.designflow.app/library https://sg.designflow.app/library \
            https://crm-fireflies.designflow.app/health; do
            curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "$url" >/dev/null
          done
