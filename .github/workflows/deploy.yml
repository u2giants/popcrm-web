name: Build and Deploy

# Single orchestrated production workflow (CI/CD rules §12.1):
#   verify -> build & publish image to GHCR -> trigger Coolify deploy.
# GitHub Actions owns verification, build and publishing; Coolify owns runtime
# config and deployment execution and pulls the published image. GitHub Actions
# never SSHes into or mutates the production server (§3, §10).

on:
  push:
    branches: [main]
    # Docs / AI-context-only changes don't ship a new build (§29). The app serves
    # no markdown, and the ignore files only affect AI tooling, not the bundle.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claudeignore'
      - '.cursorignore'
      - '.copilotignore'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: u2giants/popcrm-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Catches an unmatched fi/done inside any run: block. Bash parses lazily,
      # so a broken tail can sit in a workflow for months without a red run.
      - name: Validate workflow shell blocks
        run: ./scripts/check-workflow-shell.sh
      - name: Lint
        run: npm run lint
      # The suite must run here, not just on a developer's machine. A Vitest
      # major once landed on main with no CI test execution at all because this
      # job only linted and built.
      - name: Test
        run: npm test
      - name: Typecheck and build
        run: npm run build

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Mutable pointers (latest, main) plus the immutable sha-<sha> audit tag (§18).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_HASH=${{ steps.vars.outputs.sha7 }}
            COMMIT_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            VITE_LOGODEV_TOKEN=${{ secrets.LOGODEV_TOKEN }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_SERVER_UUID }}
        run: |
          curl -fsS -X POST \
            "${COOLIFY_BASE_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=true" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json"

      - name: Wait for production to serve this commit
        run: |
          expected_sha="${GITHUB_SHA::7}"

          for i in $(seq 1 90); do
            html="$(curl -fsSL -H 'Cache-Control: no-cache' "https://crm.designflow.app/?deploy-check=${expected_sha}" || true)"
            asset_path="$(printf '%s' "$html" | sed -nE 's/.*src="([^"]*\/assets\/index-[^"]+\.js)".*/\1/p' | head -1)"

            if [ -n "$asset_path" ]; then
              case "$asset_path" in
                http*) asset_url="$asset_path" ;;
                *) asset_url="https://crm.designflow.app${asset_path}" ;;
              esac

              if curl -fsSL -H 'Cache-Control: no-cache' "$asset_url" | grep -q "$expected_sha"; then
                echo "production is serving commit ${expected_sha}"
                exit 0
              fi
            fi

            if [ -n "$asset_path" ]; then
              echo "waiting for production to serve ${expected_sha}; current bundle is ${asset_path} ($i/90)"
            else
              echo "waiting for production bundle discovery ($i/90)"
            fi
            sleep 5
          done

          echo "production did not serve commit ${expected_sha} within 7.5 minutes" >&2
          if html="$(curl -fsSL -H 'Cache-Control: no-cache' https://crm.designflow.app/ || true)"; then
            printf '%s\n' "$html" | sed -nE 's/.*src="([^"]*\/assets\/index-[^"]+\.js)".*/last seen bundle: \1/p' >&2
          fi
          exit 1
