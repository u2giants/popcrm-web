name: Task Gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: task-gates-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  route:
    # Pinned to a commit SHA (#72): a movable @main tag would let an unrelated
    # push in popcre/ai-devops change this repo's CI behaviour.
    uses: popcre/ai-devops/.github/workflows/edge-dev3-route.yml@fbcd06d9f91068d194db0b9442056c5055046bdb # main 2026-11-19
    with:
      heartbeat: ${{ vars.EDGE_DEV3_RUNNER_HEARTBEAT }}
      fallback: ubuntu-latest

  verify:
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Check out POP CRM
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Check out accepted task-gate engine
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: popcre/ai-devops
          ref: 4d83f9a5dc400f87408663eddac872b9074c18ed
          path: .task-gates-toolkit
          persist-credentials: false
      - name: Add task-gate commands to the runner path
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.task-gates-toolkit/bin" >> "$GITHUB_PATH"
      - name: Verify installed command and POP CRM policy
        shell: bash
        run: |
          ai-task-gates version
          ai-repo-policy | jq -e '.repository == "u2giants/popcrm-web"'
          bash scripts/test-task-gates.sh
