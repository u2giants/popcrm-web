name: Retire obsolete CMS runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm replacement applications are healthy
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://crm.designflow.app \
            https://pm.designflow.app \
            https://dam.designflow.app/library \
            https://sg.designflow.app/library \
            https://crm-fireflies.designflow.app/health
          do
            curl --fail --silent --show-error --location --retry 3 "$url" >/dev/null
          done

      - name: Remove unused legacy CRM worker variables
        shell: bash
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${COOLIFY_API_TOKEN}"
          applications="$(curl --fail --silent --show-error \
            "${COOLIFY_BASE_URL}/api/v1/applications" -H "$auth")"
          app_uuid="$(jq -er '.[] | select(.name == "popcrm-fireflies") | .uuid' <<<"$applications")"
          envs="$(curl --fail --silent --show-error \
            "${COOLIFY_BASE_URL}/api/v1/applications/${app_uuid}/envs" -H "$auth")"
          for key in DX_URL DX_ADMIN_EMAIL DX_ADMIN_PASSWORD; do
            env_uuid="$(jq -er --arg key "$key" '.[] | select(.key == $key) | .uuid' <<<"$envs" || true)"
            if [[ -n "$env_uuid" ]]; then
              curl --fail --silent --show-error -X DELETE \
                "${COOLIFY_BASE_URL}/api/v1/applications/${app_uuid}/envs/${env_uuid}" \
                -H "$auth" >/dev/null
            fi
          done

      - name: Stop obsolete CMS service through Coolify
        shell: bash
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          SERVICE_UUID: nzli85mk3luzb6u7cnq5fidu
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${COOLIFY_API_TOKEN}"
          service="$(curl --fail --silent --show-error \
            "${COOLIFY_BASE_URL}/api/v1/services/${SERVICE_UUID}" -H "$auth")"
          test "$(jq -r '.uuid' <<<"$service")" = "$SERVICE_UUID"
          curl --fail --silent --show-error -X POST \
            "${COOLIFY_BASE_URL}/api/v1/services/${SERVICE_UUID}/stop" \
            -H "$auth" >/dev/null
          for attempt in {1..30}; do
            service="$(curl --fail --silent --show-error \
              "${COOLIFY_BASE_URL}/api/v1/services/${SERVICE_UUID}" -H "$auth")"
            status="$(jq -r '.status' <<<"$service")"
            if [[ "$status" != running* ]]; then
              echo "Coolify reports the obsolete service as $status."
              exit 0
            fi
            sleep 5
          done
          echo "The obsolete service did not stop within 150 seconds." >&2
          exit 1

      - name: Confirm replacement applications remain healthy
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://crm.designflow.app \
            https://pm.designflow.app \
            https://dam.designflow.app/library \
            https://sg.designflow.app/library \
            https://crm-fireflies.designflow.app/health
          do
            curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "$url" >/dev/null
          done
