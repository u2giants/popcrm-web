server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Never advertise the nginx version (issue #70).
  server_tokens off;

  # Deploy-version probe: must never be cached (issue #70 LOCKED no-store).
  location = /version.json {
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  # Hashed, immutable bundles: one single Cache-Control directive (the old
  # file layered `expires 1y` on top of a second Cache-Control header).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }
  # Real files at the root (index.html, favicon) revalidate every time.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ @spa;
  }
  # SPA fallback: any non-file route gets index.html uncached-and-unstored
  # (issue #70 LOCKED no-store), separate from the `/` no-cache above.
  location @spa {
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
    try_files /index.html =404;
  }
}
